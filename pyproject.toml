[project]
name = "homomorphic-dsp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fhe-dsp",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["lib/py/tests"]

[tool.uv.workspace]
members = [
    "lib/py",
    "exp01-esc10",
    "exp02-esc50",
]

[tool.uv]
find-links = [
    "https://csukuangfj.github.io/kaldifeat/cpu.html",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
fhe-dsp = { workspace = true }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
