[project]
name = "fhe-dsp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "h5py",
    "polars",
    "matplotlib",
    "seaborn",
    "torch==2.4.0+cpu",
    "torchaudio==2.4.0+cpu",
    "soundfile",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fhe_dsp"]
